<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Planner Calls in a Predefined Workflow</title>
  <desc id="desc">Visual description, task decomposition, waypoint prediction, navigation or manipulation policy, success detection, and a replan trigger connected in sequence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#334155" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="1400" height="460" rx="32" fill="url(#bg)"/>
  <text x="70" y="72" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">Planner Component in a Predefined Workflow</text>
  <text x="70" y="108" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748B">External rules orchestrate the loop; the LLM is called only at designated nodes</text>
  <g fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"><path d="M258 231 H282"/><path d="M478 231 H502"/><path d="M698 231 H722"/><path d="M918 231 H942"/><path d="M1138 231 H1162"/></g>
  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <g><rect x="62" y="176" width="196" height="110" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="160" cy="204" r="15" fill="#DBEAFE"/><text x="160" y="210" font-size="15" font-weight="700" fill="#2563EB">01</text><text x="160" y="246" font-size="18" font-weight="650" fill="#0F172A">Visual</text><text x="160" y="270" font-size="18" font-weight="650" fill="#0F172A">description</text></g>
    <g><rect x="282" y="176" width="196" height="110" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="380" cy="204" r="15" fill="#DBEAFE"/><text x="380" y="210" font-size="15" font-weight="700" fill="#2563EB">02</text><text x="380" y="246" font-size="18" font-weight="650" fill="#0F172A">Task</text><text x="380" y="270" font-size="18" font-weight="650" fill="#0F172A">decomposition</text></g>
    <g><rect x="502" y="176" width="196" height="110" rx="18" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="2"/><circle cx="600" cy="204" r="15" fill="#E0E7FF"/><text x="600" y="210" font-size="15" font-weight="700" fill="#4F46E5">03</text><text x="600" y="246" font-size="18" font-weight="650" fill="#0F172A">Waypoint</text><text x="600" y="270" font-size="18" font-weight="650" fill="#0F172A">prediction</text></g>
    <g><rect x="722" y="176" width="196" height="110" rx="18" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="2"/><circle cx="820" cy="204" r="15" fill="#E0E7FF"/><text x="820" y="210" font-size="15" font-weight="700" fill="#4F46E5">04</text><text x="820" y="246" font-size="17" font-weight="650" fill="#0F172A">Navigation or</text><text x="820" y="270" font-size="17" font-weight="650" fill="#0F172A">manipulation policy</text></g>
    <g><rect x="942" y="176" width="196" height="110" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1040" cy="204" r="15" fill="#DCFCE7"/><text x="1040" y="210" font-size="15" font-weight="700" fill="#16A34A">05</text><text x="1040" y="246" font-size="18" font-weight="650" fill="#0F172A">Success</text><text x="1040" y="270" font-size="18" font-weight="650" fill="#0F172A">detection</text></g>
    <g><rect x="1162" y="176" width="176" height="110" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><circle cx="1250" cy="204" r="15" fill="#FFEDD5"/><text x="1250" y="210" font-size="15" font-weight="700" fill="#EA580C">06</text><text x="1250" y="246" font-size="18" font-weight="650" fill="#9A3412">Trigger</text><text x="1250" y="270" font-size="18" font-weight="650" fill="#9A3412">replanning</text></g>
  </g>
  <path d="M1250 303 C1250 370 1110 386 1038 326" fill="none" stroke="#F97316" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="70" y="397" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94A3B8">The LLM may be called repeatedly, but preset rules still control observation, memory, replanning, and recovery.</text>
</svg>
