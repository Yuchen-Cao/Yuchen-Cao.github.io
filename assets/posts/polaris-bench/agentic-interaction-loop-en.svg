<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Interaction Loop Owned by the Agent</title>
  <desc id="desc">The agent observes, identifies missing information, selects a tool, acts, reads the result, updates its belief, verifies success, and decides whether to continue, retry, switch tools, ask for help, or stop.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="0.5" stop-color="#F0FDFA"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F766E"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
    <filter id="shadow2" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.13"/></filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/></marker>
  </defs>
  <rect width="1400" height="900" rx="32" fill="url(#bg2)"/>
  <text x="70" y="72" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">The Agent Owns the Interaction Loop</text>
  <text x="70" y="108" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748B">The model updates its belief from feedback and decides what to do next</text>
  <g fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow2)"><path d="M330 286 V326"/><path d="M330 426 V466"/><path d="M330 566 V606"/><path d="M530 661 C610 735 790 735 870 661"/><path d="M1070 606 V566"/><path d="M1070 466 V426"/><path d="M1070 326 V286"/></g>
  <path d="M870 231 C785 145 615 145 530 231" fill="none" stroke="#0F766E" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowAccent)"/>
  <g filter="url(#shadow2)" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <g><rect x="130" y="186" width="400" height="100" rx="18" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><circle cx="178" cy="236" r="22" fill="#CCFBF1"/><text x="178" y="243" font-size="17" font-weight="700" fill="#0F766E">01</text><text x="350" y="244" font-size="23" font-weight="650" fill="#0F172A">Observe the environment</text></g>
    <g><rect x="130" y="326" width="400" height="100" rx="18" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><circle cx="178" cy="376" r="22" fill="#CCFBF1"/><text x="178" y="383" font-size="17" font-weight="700" fill="#0F766E">02</text><text x="350" y="370" font-size="19" font-weight="650" fill="#0F172A">Identify what information</text><text x="350" y="396" font-size="19" font-weight="650" fill="#0F172A">is still missing</text></g>
    <g><rect x="130" y="466" width="400" height="100" rx="18" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="2"/><circle cx="178" cy="516" r="22" fill="#E0E7FF"/><text x="178" y="523" font-size="17" font-weight="700" fill="#4F46E5">03</text><text x="350" y="524" font-size="22" font-weight="650" fill="#0F172A">Choose a tool</text></g>
    <g><rect x="130" y="606" width="400" height="110" rx="18" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/><circle cx="178" cy="661" r="22" fill="#C7D2FE"/><text x="178" y="668" font-size="17" font-weight="700" fill="#4338CA">04</text><text x="350" y="669" font-size="23" font-weight="700" fill="#312E81">Execute the action</text></g>
    <g><rect x="870" y="606" width="400" height="110" rx="18" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2"/><circle cx="918" cy="661" r="22" fill="#CCFBF1"/><text x="918" y="668" font-size="17" font-weight="700" fill="#0F766E">05</text><text x="1090" y="669" font-size="23" font-weight="700" fill="#134E4A">Read the result</text></g>
    <g><rect x="870" y="466" width="400" height="100" rx="18" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><circle cx="918" cy="516" r="22" fill="#CCFBF1"/><text x="918" y="523" font-size="17" font-weight="700" fill="#0F766E">06</text><text x="1090" y="524" font-size="22" font-weight="650" fill="#0F172A">Update the belief</text></g>
    <g><rect x="870" y="326" width="400" height="100" rx="18" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><circle cx="918" cy="376" r="22" fill="#CCFBF1"/><text x="918" y="383" font-size="17" font-weight="700" fill="#0F766E">07</text><text x="1090" y="384" font-size="22" font-weight="650" fill="#0F172A">Verify success</text></g>
    <g><rect x="870" y="176" width="400" height="110" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><circle cx="918" cy="231" r="22" fill="#FFEDD5"/><text x="918" y="238" font-size="17" font-weight="700" fill="#EA580C">08</text><text x="1090" y="222" font-size="18" font-weight="700" fill="#9A3412">Continue / retry / switch tools</text><text x="1090" y="251" font-size="18" font-weight="700" fill="#9A3412">Ask for help / stop</text></g>
    <g><circle cx="700" cy="451" r="126" fill="url(#core)"/><circle cx="700" cy="451" r="139" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-dasharray="7 9"/><text x="700" y="425" font-size="22" font-weight="650" fill="#CCFBF1">Model owns the</text><text x="700" y="463" font-size="30" font-weight="750" fill="#FFFFFF">interaction loop</text><text x="700" y="502" font-size="14" fill="#E0E7FF">observe · act · update · verify</text></g>
  </g>
  <text x="700" y="824" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748B">Feedback is not the end of an episode; it is input to the next round of reasoning.</text>
</svg>
